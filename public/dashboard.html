<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRENCH ENGINE V2 - LIVE STREAM</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { background-color: #0b0e11; color: #eaecef; padding: 15px; }
        
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1f2630; padding-bottom: 10px; margin-bottom: 15px; }
        h1 { color: #14F195; font-size: 20px; font-weight: bold; letter-spacing: 1px; }
        .stats-banner { display: flex; gap: 20px; font-size: 13px; color: #848e9c; }
        .stats-banner span strong { color: #fff; }

        .trench-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; height: calc(100vh - 80px); }
        .column { background: #12161a; border: 1px solid #1f2630; border-radius: 6px; display: flex; flex-direction: column; overflow: hidden; }
        .column-header { background: #161a1e; padding: 12px; font-weight: bold; font-size: 14px; border-bottom: 1px solid #1f2630; display: flex; justify-content: space-between; align-items: center; }
        .column-header.new { color: #4ca2ff; border-top: 3px solid #4ca2ff; }
        .column-header.momentum { color: #ffa500; border-top: 3px solid #ffa500; }
        .column-header.migrated { color: #14F195; border-top: 3px solid #14F195; }
        
        .token-feed { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        
        /* Token Card */
        .token-card { background: #181e24; border: 1px solid #232c35; border-radius: 4px; padding: 10px; display: flex; flex-direction: column; gap: 6px; transition: all 0.2s ease; }
        .token-card:hover { border-color: #384756; background: #1c242b; }
        .token-card.passed { border-left: 4px solid #14F195; background: #14241c; }

        .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .token-identity { display: flex; flex-direction: column; }
        .token-name { font-weight: bold; font-size: 14px; color: #fff; }
        .token-symbol { font-size: 11px; color: #848e9c; margin-top: 2px; }
        
        .badge-score { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
        .score-pill { font-size: 12px; font-weight: bold; padding: 2px 6px; border-radius: 3px; background: #2b3641; color: #fff; }
        .grade-pill { font-size: 10px; font-weight: bold; text-transform: uppercase; }
        .grade-VERIFIED { color: #14F195; }
        .grade-CAUTION { color: #ffa500; }
        .grade-UNVERIFIED { color: #848e9c; }

        .card-metrics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; font-size: 11px; color: #b7bdc6; border-top: 1px dashed #232c35; border-bottom: 1px dashed #232c35; padding: 5px 0; }
        .metric-item span { color: #fff; font-weight: bold; }

        .card-footer { display: flex; justify-content: space-between; align-items: center; font-size: 10px; color: #848e9c; }
        .ca-string { background: #111518; padding: 2px 4px; border-radius: 2px; color: #4ca2ff; cursor: pointer; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .action-links a { color: #14F195; text-decoration: none; margin-left: 8px; }
        .action-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <header>
        <h1>🐊 TRENCH ENGINE DEFI LIVE TERMINAL</h1>
        <div class="stats-banner" id="statsBanner">
            <span>Total Logged: <strong id="statTotal">0</strong></span>
            <span>Wins: <strong id="statWins" style="color:#14F195">0</strong></span>
            <span>Losses: <strong id="statLosses" style="color:#ff4d4d">0</strong></span>
            <span>Win-Rate: <strong id="statRate">0%</strong></span>
        </div>
    </header>

    <div class="trench-container">
        <!-- COLUMN 1: NEW -->
        <div class="column">
            <div class="column-header new">⚡ NEW LAUNCHES <span id="countNew" style="font-size:11px;color:#848e9c">0</span></div>
            <div class="token-feed" id="feedNew"></div>
        </div>

        <!-- COLUMN 2: MOMENTUM -->
        <div class="column">
            <div class="column-header momentum">🎯 MOMENTUM CLIMBERS (% MC) <span id="countMomentum" style="font-size:11px;color:#848e9c">0</span></div>
            <div class="token-feed" id="feedMomentum"></div>
        </div>

        <!-- COLUMN 3: MIGRATED -->
        <div class="column">
            <div class="column-header migrated">🚀 BONDED / MIGRATED <span id="countMigrated" style="font-size:11px;color:#848e9c">0</span></div>
            <div class="token-feed" id="feedMigrated"></div>
        </div>
    </div>

    <script>
        // Setup Server-Sent Events Connection to backend pipeline
        const eventSource = new EventSource('/api/stream');
        
        eventSource.onmessage = function(event) {
            const data = JSON.parse(event.data);
            if (data.type === 'TOKEN_UPDATE') {
                renderTokenCard(data.token, data.chain);
            }
        };

        function renderTokenCard(token, chain) {
            let targetFeedId = 'feedNew';
            
            // Route dynamically into GMGN split structures based on data triggers
            if (token.isMigrated || token.liquidity > 25000) {
                targetFeedId = 'feedMigrated';
            } else if (token.volGrowth > 1.8 || token.buyerSellerRatio > 2.0) {
                targetFeedId = 'feedMomentum';
            }

            const feed = document.getElementById(targetFeedId);
            
            // Avoid duplicate card entries
            const existingCard = document.getElementById(`card-${token.address}`);
            if (existingCard) existingCard.remove();

            const isPassed = token.compositeScore >= 75;
            const card = document.createElement('div');
            card.id = `card-${token.address}`;
            card.className = `token-card ${isPassed ? 'passed' : ''}`;
            
            card.innerHTML = `
                <div class="card-top">
                    <div class="token-identity">
                        <span class="token-name">${token.symbol || 'UNTITLED'}</span>
                        <span class="token-symbol">${token.name || ''} [${chain.toUpperCase()}]</span>
                    </div>
                    <div class="badge-score">
                        <span class="score-pill">${token.compositeScore}/100</span>
                        <span class="grade-pill grade-${token.riskBadge || 'UNVERIFIED'}">${token.letterGrade || 'C'}</span>
                    </div>
                </div>
                <div class="card-metrics">
                    <div class="metric-item">MC: <span style="color:#ffa500">$${token.mcap ? token.mcap.toLocaleString() : '---'}</span></div>
                    <div class="metric-item">Liq: <span>$${token.liquidity ? token.liquidity.toLocaleString() : '---'}</span></div>
                    <div class="metric-item">B/S Ratio: <span>${token.buyerSellerRatio || '1.0'}</span></div>
                    <div class="metric-item">Socials: <span>${token.socialScore || '---'}</span></div>
                </div>
                <div class="card-footer">
                    <span class="ca-string" onclick="navigator.clipboard.writeText('${token.address}');alert('CA Copied!');">${token.address}</span>
                    <div class="action-links">
                        <a href="https://dexscreener.com/${chain}/${token.address}" target="_blank">Chart</a>
                    </div>
                </div>
            `;

            // Insert at the absolute top of the feed column
            feed.insertBefore(card, feed.firstChild);

            // Cap visible entries per column at 40 rows to prevent memory leakage
            if (feed.children.length > 40) {
                feed.lastChild.remove();
            }

            // Keep header badges incremented
            document.getElementById(`count${targetFeedId.replace('feed', '')}`).innerText = feed.children.length;
        }

        // Periodically refresh header stats panels
        async function updateStats() {
            try {
                const res = await fetch('/api/stats');
                const stats = await res.json();
                document.getElementById('statTotal').innerText = stats.total || 0;
                document.getElementById('statWins').innerText = stats.wins || 0;
                document.getElementById('statLosses').innerText = stats.losses || 0;
                document.getElementById('statRate').innerText = (stats.winRate || 0) + '%';
            } catch(e) {}
        }
        setInterval(updateStats, 10000);
        updateStats();
    </script>
</body>
</html>
